<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN IP Tracker</title>
<style>
  :root {
    --surface-0: #f1efe8;
    --surface-1: #f7f6f2;
    --surface-2: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --bg-success: #eaf3de;
    --text-success: #3b6d11;
    --border-success: #97c459;
    --bg-danger: #fcebeb;
    --text-danger: #a32d2d;
    --border-danger: #f09595;
    --bg-accent: #e6f1fb;
    --text-accent: #185fa5;
    --border-accent: #85b7eb;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-0: #1a1a18;
      --surface-1: #222220;
      --surface-2: #2c2c2a;
      --text-primary: #f1efe8;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.18);
      --bg-success: #173404;
      --text-success: #c0dd97;
      --border-success: #3b6d11;
      --bg-danger: #501313;
      --text-danger: #f7c1c1;
      --border-danger: #a32d2d;
      --bg-accent: #042c53;
      --text-accent: #b5d4f4;
      --border-accent: #185fa5;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--surface-0);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 2rem;
  }
  .card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .ip-display {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
  }
  .ip-value {
    font-size: 28px;
    font-weight: 500;
    font-family: monospace;
    letter-spacing: 0.5px;
  }
  .ip-loading {
    font-size: 14px;
    color: var(--text-muted);
  }
  .ip-meta {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 1.25rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .ip-meta span { display: flex; align-items: center; gap: 4px; }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    padding: 0.65rem 1rem;
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-1);
    color: var(--text-primary);
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.98); }
  .btn-safe {
    background: var(--bg-success);
    color: var(--text-success);
    border-color: var(--border-success);
  }
  .btn-flagged {
    background: var(--bg-danger);
    color: var(--text-danger);
    border-color: var(--border-danger);
  }
  .btn-export {
    background: var(--bg-accent);
    color: var(--text-accent);
    border-color: var(--border-accent);
    grid-column: 1 / -1;
    margin-top: 0.25rem;
  }
  .btn-refresh {
    font-size: 13px;
    padding: 0.4rem 0.75rem;
    background: transparent;
    border-color: var(--border);
    color: var(--text-secondary);
  }
  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.75rem;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.6rem 0.75rem;
    background: var(--surface-1);
    border-radius: var(--radius);
    font-size: 13px;
    border: 0.5px solid var(--border);
  }
  .history-ip {
    font-family: monospace;
    font-weight: 500;
    flex: 1;
    font-size: 14px;
  }
  .history-date {
    color: var(--text-muted);
    font-size: 12px;
  }
  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-safe {
    background: var(--bg-success);
    color: var(--text-success);
  }
  .badge-flagged {
    background: var(--bg-danger);
    color: var(--text-danger);
  }
  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--text-muted);
    font-size: 14px;
  }
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text-primary);
    color: var(--surface-0);
    padding: 0.6rem 1.25rem;
    border-radius: 20px;
    font-size: 14px;
    transition: transform 0.25s ease;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .count-badge {
    font-size: 12px;
    background: var(--surface-0);
    color: var(--text-muted);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 2px 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>VPN IP Tracker</h1>
  <p class="subtitle">Détecte ton IP actuelle et enregistre si elle est flaggée ou non.</p>

  <div class="card">
    <div class="ip-display">
      <div>
        <div class="ip-value" id="ip-val">—</div>
        <div class="ip-meta" id="ip-meta"><span class="ip-loading">Détection en cours…</span></div>
      </div>
      <button class="btn-refresh" onclick="fetchIP()" title="Rafraîchir">↺</button>
    </div>
    <div class="actions">
      <button class="btn-safe" onclick="saveIP(false)">✓ Non flaggée</button>
      <button class="btn-flagged" onclick="saveIP(true)">⚑ Flaggée</button>
      <button class="btn-export" onclick="exportCSV()">↓ Exporter toutes les IPs (.csv)</button>
    </div>
  </div>

  <div class="card">
    <div class="header-row">
      <div class="section-title">Historique</div>
      <span class="count-badge" id="count-badge">0</span>
    </div>
    <div class="history-list" id="history-list">
      <div class="empty-state">Aucune IP enregistrée pour l'instant.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentIP = null;
let currentMeta = {};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function fetchIP() {
  document.getElementById('ip-val').textContent = '—';
  document.getElementById('ip-meta').innerHTML = '<span class="ip-loading">Détection en cours…</span>';
  currentIP = null;
  try {
    const r = await fetch('https://ipapi.co/json/');
    const d = await r.json();
    currentIP = d.ip;
    currentMeta = { country: d.country_name, city: d.city, org: d.org };
    document.getElementById('ip-val').textContent = d.ip;
    document.getElementById('ip-meta').innerHTML =
      `<span>🌍 ${d.country_name || '?'}</span><span>🏙 ${d.city || '?'}</span><span>🏢 ${d.org || '?'}</span>`;
  } catch(e) {
    document.getElementById('ip-val').textContent = 'Erreur';
    document.getElementById('ip-meta').innerHTML = '<span style="color:var(--text-danger)">Impossible de récupérer l\'IP.</span>';
  }
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('ip_history') || '[]'); } catch { return []; }
}

function saveHistory(h) {
  localStorage.setItem('ip_history', JSON.stringify(h));
}

function saveIP(flagged) {
  if (!currentIP) { showToast('IP pas encore chargée, patiente…'); return; }
  const entry = {
    ip: currentIP,
    flagged,
    country: currentMeta.country || '',
    city: currentMeta.city || '',
    org: currentMeta.org || '',
    date: new Date().toISOString()
  };
  const h = getHistory();
  h.unshift(entry);
  saveHistory(h);
  renderHistory();
  showToast(flagged ? '⚑ IP enregistrée comme flaggée' : '✓ IP enregistrée comme non flaggée');
}

function renderHistory() {
  const h = getHistory();
  const list = document.getElementById('history-list');
  document.getElementById('count-badge').textContent = h.length;
  if (!h.length) {
    list.innerHTML = '<div class="empty-state">Aucune IP enregistrée pour l\'instant.</div>';
    return;
  }
  list.innerHTML = h.map((e, i) => `
    <div class="history-item">
      <span class="history-ip">${e.ip}</span>
      <span class="badge ${e.flagged ? 'badge-flagged' : 'badge-safe'}">${e.flagged ? '⚑ Flaggée' : '✓ OK'}</span>
      <span class="history-date">${new Date(e.date).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      <button style="padding:2px 8px;font-size:12px;border-radius:4px;border:0.5px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer" onclick="deleteEntry(${i})">✕</button>
    </div>
  `).join('');
}

function deleteEntry(i) {
  const h = getHistory();
  h.splice(i, 1);
  saveHistory(h);
  renderHistory();
  showToast('Entrée supprimée');
}

function exportCSV() {
  const h = getHistory();
  if (!h.length) { showToast('Aucune IP à exporter'); return; }
  const header = 'IP,Statut,Pays,Ville,Organisation,Date';
  const rows = h.map(e =>
    `${e.ip},${e.flagged ? 'Flaggée' : 'Non flaggée'},${e.country},${e.city},"${(e.org||'').replace(/"/g,'""')}",${e.date}`
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ip_history_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Export téléchargé !');
}

fetchIP();
renderHistory();
</script>
</body>
</html>
